name: PR validation
on:
  pull_request:
    types: [synchronize, opened, reopened, edited]
    branches:
      - release-*
      - master
      - stage
      - main
      - production

jobs:
  test-compile:
    runs-on: ubuntu-24.04
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          node.store.allow_mmap: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --memory 2g
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Report workflow details
        run: |
          echo "Repository ${{ github.repository }}."
          echo "Trigger ref ${{ github.ref }}, base-ref ${{ github.base_ref }}, head_ref ${{ github.head_ref }}."
      - name: Check out repository code
        uses: actions/checkout@v3
      - run: cp agr_api/src/main/resources/application.properties.defaults agr_api/src/main/resources/application.properties
      - name: Report files updated in PR
        run: |
          git fetch -q origin ${{ github.base_ref }} ${{ github.head_ref }}
          git diff --name-only origin/${{ github.base_ref }} origin/${{ github.head_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Report runtime details
        run: |
          echo "Github runner OS: ${{ runner.os }}"
      - name: Report Maven version
        run: |
          mvn --version
      - name: Test related-data count batching against Elasticsearch
        run: |
          mvn -pl agr_api -am test -ntp \
            -Dtest=SearchDAOCountQueriesTest,SearchServiceRelatedDataTest,SearchRelatedDataElasticsearchIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DrelatedDataTestUrl=http://localhost:9200
      - name: Package Everything
        run: |
          mvn -T 8 clean package -ntp -DskipTests=true

  test-build-docker-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: AWS credentials configuration
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Amazon ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build docker image
        run: docker build -t agr_java_software:latest .
