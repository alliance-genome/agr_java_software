name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      review_type:
        description: 'Type of review to perform'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - security
          - performance
          - comprehensive

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          model: claude-sonnet-4-20250514
          max_turns: 10
          
          # Custom instructions for AGR Java codebase
          custom_instructions: |
            You are reviewing code for the Alliance of Genome Resources Java application.
            
            FOCUS ONLY ON:
            1. Critical and blocking bugs that could cause data corruption or system failures
            2. Database performance issues (inefficient queries, N+1 problems, missing indexes)
            
            Keep reviews concise and actionable. Only flag serious issues that need immediate attention.
          
          # Direct prompt for automated reviews
          direct_prompt: |
            ${{ github.event_name == 'pull_request' && format('
            Review this PR focusing ONLY on:
            1. Critical and blocking bugs that could cause data corruption or system failures
            2. Database performance issues (inefficient queries, N+1 problems, missing indexes)
            
            Use the zen codereview tool with o3 and gemini-2.5-pro models for analysis.
            Keep feedback concise and actionable.
            ') || '' }}
          
          # MCP Configuration for Zen tools
          mcp_config: |
            {
              "servers": {
                "zen": {
                  "command": "sh",
                  "args": [
                    "-c",
                    "exec $(which uvx || echo uvx) --from git+https://github.com/BeehiveInnovations/zen-mcp-server.git zen-mcp-server"
                  ],
                  "env": {
                    "PATH": "/usr/local/bin:/usr/bin:/bin:/opt/homebrew/bin:~/.local/bin",
                    "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}",
                    "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}"
                  }
                }
              }
            }
          
          # Allowed tools - comprehensive list for full functionality  
          allowed_tools: "mcp__zen__codereview,mcp__zen__secaudit,mcp__zen__analyze,mcp__zen__testgen,mcp__zen__debug,mcp__zen__refactor,mcp__zen__chat,mcp__zen__consensus,mcp__zen__thinkdeep,mcp__zen__planner,mcp__zen__precommit,mcp__zen__tracer,mcp__zen__docgen,mcp__zen__challenge,mcp__zen__listmodels,mcp__zen__version,Bash,Edit,Read,Write,Glob,Grep,LS"
          
          # Environment variables for Claude
          claude_env: |
            REVIEW_TYPE: ${{ inputs.review_type || 'standard' }}
            REPOSITORY: agr_java_software
            ORGANIZATION: alliance-genome
            JAVA_VERSION: 21