name: Checkstyle Action
on: pull_request

jobs:
  checkstyle_job:
    runs-on: ubuntu-latest
    name: Checkstyle Job
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Run check style
      uses: dbelyaev/action-checkstyle@master
      with:
        level: 'error'
        checkstyle_config: checkstyle.xml
